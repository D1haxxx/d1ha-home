<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Family Lab — место для маленьких веб-проектов.">
<title>Family Lab</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #101b18; color: #f6f4e8; font: 1rem/1.6 system-ui, sans-serif; }
  main { width: min(100% - 3rem, 58rem); margin-inline: auto; }
  header { padding-block: clamp(4rem, 12vw, 9rem) 3rem; }
  .label { color: #bbeb8a; font: 0.85rem/1.5 monospace; letter-spacing: .12em; }
  h1 { font-size: clamp(3rem, 12vw, 8rem); line-height: .95; margin: .2em 0; letter-spacing: -.075em; }
  header p:last-child { color: #cbd6cc; font-size: clamp(1.1rem, 3vw, 1.4rem); max-width: 32rem; }
  section { border-top: 1px solid #526558; padding-block: 2rem 3rem; }
  article { background: #1d3027; padding: 1.5rem; border-radius: 1rem; }
  h2, h3, article p { margin: 0 0 .5rem; }
  footer { padding-bottom: 2rem; color: #cbd6cc; }
</style>
</head>
<body>
<main>
  <header>
    <p class="label">D1HA.COM / ВЕБ-МАСТЕРСКАЯ</p>
    <h1>Family Lab</h1>
    <p>Место для маленьких сайтов, игр и идей, которые хочется попробовать.</p>
  </header>
  <section aria-labelledby="projects">
    <h2 id="projects">Проекты</h2>
    <article>
      <p class="label">01 / САЙТ</p>
      <h3>Стартовая страница</h3>
      <p>Ты уже на ней. Здесь будут появляться ссылки на новые проекты Family Lab.</p>
    </article>
  </section>
  <footer>Family Lab · d1ha.com</footer>
</main>
</body>
</html>
